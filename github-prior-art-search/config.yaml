# 技能名稱與版本以 SKILL.md 的 frontmatter 為唯一來源
# （Agent Skills 標準，agentskills.io）；本檔僅存放執行規則。

# ---------------------------------------------------------------------------
# 硬性規則（§5）：由腳本強制執行，模型不得覆寫
# ---------------------------------------------------------------------------
hard_rules:
  ignore_stars_below_100:
    enabled: true
    field: stargazers_count
    threshold: 100
    action: discard
  ignore_archived:
    enabled: true
    value: true
    action: discard
  ignore_disabled:
    enabled: true
    value: true
    action: discard
  ignore_no_license_for_direct_reuse:
    enabled: true
    action: downgrade_to_reference_only
    risk_level: high
  copyleft_manual_review:
    enabled: true
  model_cannot_override_script_decision:
    enabled: true

# ---------------------------------------------------------------------------
# 搜尋參數（§10）
# ---------------------------------------------------------------------------
search:
  endpoint: https://api.github.com/search/repositories
  per_page: 50
  sort: updated
  order: desc
  max_queries: 10          # Search API 認證後限 30 req/min，控制查詢數
  request_delay_seconds: 2.5
  rate_limit_max_wait_seconds: 130

defaults:
  min_stars: 100
  enforced_min_stars: 100   # 即使輸入更低，仍強制 100（§6）
  max_candidates: 8         # 深度分析候選上限
  last_commit_within_days: 730
  license_preference:
    - MIT
    - Apache-2.0
    - BSD-3-Clause

# ---------------------------------------------------------------------------
# 授權政策（§11）
# ---------------------------------------------------------------------------
license_policy:
  preferred:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
  review_required:
    - MPL-2.0
    - LGPL-3.0
    - GPL-3.0
  high_risk:
    - AGPL-3.0
    - SSPL-1.0
  unknown:
    - NOASSERTION
  scores:
    preferred: 100
    review_required: 40
    high_risk: 10
    unknown: 0
  actions:
    preferred: allow_reuse
    review_required: require_manual_review
    high_risk: avoid_direct_reuse
    unknown: reference_only
  risk_levels:
    preferred: low
    review_required: medium
    high_risk: high
    unknown: high

# ---------------------------------------------------------------------------
# 依賴風險規則（§12.3）
# ---------------------------------------------------------------------------
dependency_risk_rules:
  high_total_dependencies:
    threshold: 200
    level: medium
  high_unpinned_dependencies:
    threshold: 20
    level: medium
  no_lockfile:
    level: medium
  outdated_major_versions:
    enabled: false
  known_vulnerabilities:
    enabled: false

# ---------------------------------------------------------------------------
# 評分權重（§13.1），子分數皆為 0-100，總分 = Σ(子分數×權重)/100
# ---------------------------------------------------------------------------
scoring_weights:
  relevance: 35
  reusability: 20
  maintenance_activity: 15
  code_quality: 10
  documentation: 10
  license_fit: 10

relevance_signals:
  name_match: 20
  description_match: 15
  topics_match: 10
  readme_match: 10
  feature_match: 30
  tech_stack_match: 15
  enable_readme_match: true

documentation_signals:
  has_readme: 30
  readme_has_install: 20
  readme_has_usage: 20
  has_docs_folder: 15
  has_examples_folder: 15

code_quality_signals:
  has_tests: 25
  has_ci: 25
  has_lint_config: 15
  has_release: 15
  has_src_structure: 20

# reusability 訊號：規格 §13 未定義此子分數的細節，
# 本實作採用以下訊號（滿分 20，詳見 references/RULES.md）。
reusability_signals:
  lockfile_present: 5
  has_release_or_tags: 4
  moderate_dependency_count: 4   # 總依賴 <=100 滿分、>=200 零分、線性內插
  has_examples: 4
  packaged_project: 3            # 具備 Dockerfile 或套件清單

maintenance_buckets:             # §13.3
  - max_days: 90
    score: 100
  - max_days: 180
    score: 85
  - max_days: 365
    score: 70
  - max_days: 730
    score: 40
  - score: 10                    # 超過 730 天

# ---------------------------------------------------------------------------
# 決策規則（§14）。
# evaluation_order 為本實作補充的明確評估優先序：
# 先檢查風險排除，再由嚴格到寬鬆依序判定；全數不符則 insufficient_fit，
# 且當所有候選皆不符門檻時，整體建議為 build_in_house。
# ---------------------------------------------------------------------------
decision_rules:
  evaluation_order:
    - avoid_due_to_risk
    - adopt_as_dependency
    - fork_and_modify
    - use_as_template
    - reference_architecture_only
  adopt_as_dependency:
    total_score: 80
    relevance: 80
    license_fit: 90
    maintenance_activity: 70
    dependency_risk_max: medium   # <= medium
  fork_and_modify:
    total_score: 75
    relevance: 75
    license_fit: 70
    maintenance_activity: 50
  use_as_template:
    total_score: 70
    relevance: 70
    license_fit: 70
  reference_architecture_only:
    total_score: 55
    relevance: 60

# ---------------------------------------------------------------------------
# 目錄與環境變數預設值（§4.5）
# ---------------------------------------------------------------------------
cache_dir_default: .cache/github-prior-art-search
output_dir_default: output/github-prior-art-search

dependency_manifests:            # §12.1
  npm:
    files:
      - package.json
    lockfiles:
      - package-lock.json
      - yarn.lock
      - pnpm-lock.yaml
  python:
    files:
      - requirements.txt
      - pyproject.toml
      - setup.py
      - poetry.lock
      - Pipfile.lock
    lockfiles:
      - poetry.lock
      - Pipfile.lock
  go:
    files:
      - go.mod
    lockfiles:
      - go.sum
  rust:
    files:
      - Cargo.toml
    lockfiles:
      - Cargo.lock
  java:
    files:
      - pom.xml
      - build.gradle
      - build.gradle.kts
    lockfiles: []
